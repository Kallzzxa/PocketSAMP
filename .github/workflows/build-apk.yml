name: Build PocketSAMP APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Task Build Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-cache-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed APK
        run: ./gradlew assembleDebug --build-cache --parallel --stacktrace

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketSAMP-signed-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload to GoFile (High-Speed Mirror)
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "PocketSAMP-v1.0.0-signed.apk"
            SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name // "store1"')
            echo "Uploading APK to GoFile server: $SERVER..."
            RESPONSE=$(curl -s -F "file=@PocketSAMP-v1.0.0-signed.apk" "https://${SERVER}.gofile.io/contents/uploadfile")
            DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
            echo "================================================="
            echo "🚀 GOFILE HIGH-SPEED DOWNLOAD LINK: $DOWNLOAD_PAGE"
            echo "================================================="
            echo "### 🚀 GoFile High-Speed Direct Link (Full Speed)" >> $GITHUB_STEP_SUMMARY
            echo "👉 **[Download PocketSAMP APK ($DOWNLOAD_PAGE)]($DOWNLOAD_PAGE)**" >> $GITHUB_STEP_SUMMARY
          fi
